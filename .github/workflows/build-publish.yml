name: Build and publish Python package to TestPyPI and DockerHub

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+rc[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+a[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+b[0-9]+"

# split the workflow into two jobs: bulid and publish
# this reduces surface attack area (publish job has access to publish credentials, build job doesn't)

jobs:

  publish-dockerhub:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6.0.0
        with:
          images: |
            tuilindo05/py-playground-tuilindo05
          tags: |
            type=raw,value=latest,enable=${{ !contains(github.ref_name, 'a') && !contains(github.ref_name, 'b') && !contains(github.ref_name, 'rc') }}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}},value=${{ github.ref_name }},match=v(.*)
            type=semver,pattern={{major}}.{{minor}},value=${{ github.ref_name }},match=v(.*)
            type=raw,value={{date 'YYYYMMDD'}}-{{sha}}

      - name: Build image for smoke tests
        uses: docker/build-push-action@v7.0.0
        with:
          file: ./Dockerfile
          context: ./
          target: runtime
          # load the image into the runner's local Docker Engine
          load: true
          push: false
          tags: |
            ${{ steps.meta.outputs.tags }}
            tuilindo05/py-playground-tuilindo05:smoke-${{ github.sha }}
          # try to reuse Docker build layers saved in GitHub Actions' cache (cache is scoped to the repo), avoiding repeated work
          cache-from: type=gha
          # save this build's layers to that cache, cache both intermediate and final layers, speeding up future builds
          cache-to: type=gha,mode=max

      # enable stricter behavior in Bash scripts:
      # -euo pipefail = -e -u -o pipefail
      # -e = stop the script when the command fails
      # -u = treat an unset variable as an error
      # -o pipefail = make a pipeline fail if any command in it fails, not only the last one
      - name: Smoke test image
        run: |
          set -euo pipefail
          printf '7\n' | docker run --rm -i tuilindo05/py-playground-tuilindo05:smoke-${{ github.sha }}
          docker run --rm tuilindo05/py-playground-tuilindo05:smoke-${{ github.sha }} \
            python -c 'import py_playground; print("import smoke test passed")'

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'tuilindo05/py-playground-tuilindo05:smoke-${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'

      - name: Login to Docker Hub
        uses: docker/login-action@v4.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
  
      # <<< "$TAGS" feeds the multiline tag list into the while loop
      # the loop read one tag per line, skips blank lines and runs push for each remaining tag
      # note that local smoke-sha tag is not included in this step
      - name: Push Docker image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [ -z "$tag" ] || docker push "$tag"
          done <<< "$TAGS"

  build:
    needs:
      - publish-dockerhub
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # - name: Setup Python
      #   uses: actions/setup-python@v7.0.0
      #   with:
      #     python-version-file: ".python-version"

      - name: Install UV
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: false

      - name: Build
        run: uv build

      # here you can also perform optional smoke tests on created distributions (sdist and wheel)
      # let's skip it for now
      # - name: Smoke test
      #   run : ...

      # by default, jobs in GitHub Actions run in isolated virtual environments
      # so if Job A builds an app, it must upload the binary as an artifact so Job B can later download and use it
      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v7.0.0
        with:
          name: dist
          path: dist/

  publish-testpypi:
    # wait for the previous job to finish successfully before starting this one
    # without waiting, the jobs would run in parallel
    needs:
      - build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://test.pypi.org/project/py-playground-1086kamil/
    permissions:
      id-token: write
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install UV
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: false

      # download the previously uploaded artifact
      - name: Download a Build Artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist/

      # attestation are optional but recommended
      # default path to find the attestations is "dist/*" so no need to write it here
      - name: Generate PEP 740 attestations
        uses: astral-sh/attest-action@v0.0.6

      - name: Publish
        run: uv publish --index testpypi --trusted-publishing always

      # GitHub creates a read-only token in the secrets context by default
      # this means that you always have access to it if you need it
      # in addition, every GitHub runner includes the handy GitHub CLI by default
      # this makes performing certain tasks, like creating a release, simpler
      # GITHUB_TOKEN is used here to authenticate the user to access GitHub CLI and create a release
      # env persists only for this step
      # use env to pass the token to GitHub CLI as GitHub CLI can't access secrets on its own
      # check if release tag ends with rc, a or b followed by digits
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ "$RELEASE_TAG" =~ (rc|a|b)[0-9]+$ ]]; then
            gh release create "$RELEASE_TAG" ./dist/* --generate-notes --prerelease
          else
            gh release create "$RELEASE_TAG" ./dist/* --generate-notes
          fi
