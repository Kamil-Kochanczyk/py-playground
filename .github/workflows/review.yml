name: Review (lint, format, typecheck) and test Python package

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  # workflow_dispatch enables manually running the workflow with a button in GitHub
  workflow_dispatch:

# limit GITHUB_TOKEN's permissions
# least-privilege principle: grant a workflow only the access it needs
permissions:
  contents: read

jobs:

  review:
    name: Lint and format with Ruff, typecheck with Mypy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version-file: ".python-version"

      - name: Install UV
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true

      # normal dependencies + dev dependency group + docs dependency group + optional dependencies
      - name: Install the project
        run: uv sync --locked --all-groups --all-extras

      - name: Lint and format with Ruff
        run: |
          uv run ruff check . --output-format=github
          uv run ruff format --check .

      - name: Typecheck with Mypy
        if: always()
        run: uv run mypy .

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    # needs:
      # - review
    runs-on: ${{ matrix.os }}
    # matrix strategy lets you use variables in a single job definition to automatically create multiple job runs that are based on the combinations of the variables
    # for example, you can use a matrix strategy to test your code in multiple versions of a language or on multiple operating systems
    strategy:
      matrix:
        os: ["ubuntu-latest", "windows-latest"]
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          # python-version-file: ".python-version"
          # python-version-file: "pyproject.toml"

      - name: Install UV
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          # python-version: $={{ matrix.python-version }}

      # normal dependencies + dev dependency group + docs dependency group + optional dependencies
      - name: Install the project
        run: uv sync --python "${{ matrix.python-version }}" --locked --all-groups --all-extras

      - name: Test with Pytest
        run: |
          uv run pytest --cov=src/py_playground/expense_tracker --cov-report= --cov-branch
        env:
          COVERAGE_FILE: .coverage.${{ matrix.os }}.${{ matrix.python-version }}

      - name: Upload raw coverage data
        uses: actions/upload-artifact@v7.0.0
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python-version }}
          path: .coverage.${{ matrix.os }}.${{ matrix.python-version }}
          if-no-files-found: warn
          include-hidden-files: true

  combine:
    name: Combine Coverage Results
    needs:
      - test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      
      - name: Set up Python 3.12
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install UV
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --python "3.12" --locked --all-groups --all-extras
      
      - name: Download all coverage data
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: coverage-*
          path: .coverage_data
          merge-multiple: true
      
      - name: Combine And Generate Report
        run: |
          uv run coverage combine .coverage_data
          uv run coverage report --show-missing
          uv run coverage html
      
      - name: Upload final coverage report
        uses: actions/upload-artifact@v7.0.0
        with:
          name: coverage-html-full
          path: htmlcov/
          if-no-files-found: warn
