name: Publish to TestPyPI

on:
  push:
    tags:
    - 'v*.*.*'

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://test.pypi.org/project/py-playground-1086kamil/
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: false
      - run: uv build
      - run: uv publish --index testpypi --trusted-publishing always