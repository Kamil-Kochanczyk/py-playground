name: webapp-db-cicd

on:
  push:
    # branches:
      # - 'example-web-app'
    tags:
      - 'webapp-v*'

jobs:
  tag-build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6.0.0
        with:
          images: |
            tuilindo05/dockercourse-postgres
          tags: |
            type=raw,value=latest
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}},value=${{ github.ref_name }},match=webapp-v(.*)
            type=semver,pattern={{major}}.{{minor}},value=${{ github.ref_name }},match=webapp-v(.*)
            type=raw,value={{date 'YYYYMMDD'}}-{{sha}}

      - name: Login to Docker Hub
        uses: docker/login-action@v4.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7.0.0
        with:
          file: ./webapp/webapp-db/Dockerfile
          context: ./webapp/webapp-db/
          # target: prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          secrets: |
            "secret.txt=${{ secrets.WEBAPP_DB_BUILD_SECRET }}"
          # build-args: |
          #   BASE_IMG_TAG=18.6-alpine3.24

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'tuilindo05/dockercourse-postgres:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'
