# this file is the overlay for the docker-compose-dev.yml file
# it is suppossed to be merged with the docker-compose-dev.yml file to enable running tests on the webapp-backend container
# the options specified here will override and/or merge with the options in the docker-compose-dev.yml file
# docker compose -f docker-compose-dev.yml -f docker-compose-test.yml up --build

services:
  webapp-db:
    container_name: webapp-db-test
    image: webapp-db:1.0test
  webapp-backend:
    container_name: webapp-backend-test
    image: webapp-backend:1.0test
    command:
      - "npm"
      - "run"
      - "test"
  webapp-frontend:
    container_name: webapp-frontend-test
    image: webapp-frontend:1.0test
